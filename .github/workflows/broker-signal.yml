name: Broker Signal

# 2026-07-08 下架：fetch_broker_signal.py 抓的 TWSE TWT44U 其實是「投信買賣超
# 彙總表」（市場整體統計，忽略 stockNo 參數），不是真正的個股券商分點資料，
# 快取因此長期都是無效的 0 筆。真正的個股分點日報有驗證碼保護，非付費 API
# 無法穩定取得。停用每日排程，避免浪費 Action 額度產生沒有意義的資料；
# 保留 workflow_dispatch 供之後找到可靠資料源時手動測試用。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  broker-signal:
    runs-on: ubuntu-latest
    # fetch_broker_signal.py 內建 5 分鐘抓取時間預算（FETCH_TIME_BUDGET），
    # 保證一定會在時間內跑完並讓下面的 commit 步驟正常執行，15 分鐘已含充裕緩衝。
    # 2026-07-08：原本 90 分鐘的做法會讓落後太多天時整次執行被 timeout 砍掉、
    # 進度全部遺失、隔天從同一點重來，永遠追不上、永遠沒有新資料。
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run broker signal fetcher
        run: python scripts/fetch_broker_signal.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/broker_signal.json data/_broker_cache.json
          git diff --cached --quiet || git commit -m "chore: update broker signal $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
