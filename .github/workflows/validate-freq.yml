name: Auto Sync ETF Dividend Info

"on":
  schedule:
    - cron: "0 1 * * 1"   # 每週一 台北時間 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Auto sync ETF dividend info (new ETFs + avg + months + freq)
        run: python scripts/auto_sync_etfs.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dividend_info.json
          git diff --cached --quiet && echo "no changes" || (
            git commit -m "chore: auto-sync ETF dividend info $(date +'%Y-%m-%d')" &&
            git pull --rebase origin main &&
            git push
          )