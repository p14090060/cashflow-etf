name: Validate ETF Dividend Frequency

on:
  schedule:
    - cron: "0 1 * * 1"   # 每週一 UTC 01:00 = 台灣時間週一 09:00
  workflow_dispatch:        # 允許手動觸發

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Validate dividend frequency against TWSE
        run: python scripts/validate_div_freq.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dividend_info.json
          git diff --cached --quiet && echo "no changes" || (
            git commit -m "fix: 自動修正 ETF 配息頻率 $(date +'%Y-%m-%d')" &&
            git pull --rebase origin main &&
            git push
          )
