name: Update Dividend Calendar

on:
  schedule:
    - cron: "30 0 * * 1-5"   # 每個工作日 台北時間 08:30（UTC 00:30）
  workflow_dispatch:           # 支援手動觸發

permissions:
  contents: write

jobs:
  fetch-dividend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch dividend calendar（TWSE + FinMind 雙源）
        env:
          FINMIND_TOKEN:       ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/fetch_dividend_calendar.py

      - name: Commit dividend_calendar.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dividend_calendar.json
          git diff --cached --quiet || git commit -m "chore: update dividend calendar $(date +'%Y-%m-%d' -d '+8 hours')"
          git pull --rebase origin main
          git push
