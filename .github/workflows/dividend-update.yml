name: Update Dividend Calendar

on:
  schedule:
    - cron: "30 0 * * 1-5"   # 每個工作日 台北時間 08:30（UTC 00:30）
  workflow_dispatch:           # 支援手動觸發

permissions:
  contents: write

concurrency:
  group: dividend-update
  cancel-in-progress: false

jobs:
  fetch-dividend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch dividend calendar（TWSE + FinMind 雙源）and commit
        env:
          FINMIND_TOKEN:       ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        # 每次嘗試都從最新 origin/main 重新產生（不沿用舊結果），再交給 publish_gate.py：
        # 契約驗證、只允許 data/dividend_calendar.json、固定 SHA 推送、不 force。推送被拒或驗證失敗 → 整輪重來，
        # 最多 3 次；全部失敗 exit 1（不當成功）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main || exit 1
            python scripts/fetch_dividend_calendar.py || exit 1
            if python scripts/publish_gate.py --message "chore: update dividend calendar $(date +'%Y-%m-%d' -d '+8 hours')" data/dividend_calendar.json; then exit 0; fi
            echo "publish attempt $i/3 failed, regenerating on the new origin/main"
            sleep $((i * 10))
          done
          echo "::error::data/dividend_calendar.json not published after 3 attempts"
          exit 1
