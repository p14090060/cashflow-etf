name: Fetch ETF Data

on:
  schedule:
    - cron: "0 1 * * 1-5"    # 台灣時間 09:00，週一至週五（錯開 dividend-update 的 08:30）
    - cron: "0 7 * * 1-5"    # 台灣時間 15:00，收盤後 yfinance 更新完畢
  workflow_dispatch:           # 手動觸發

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests

      # ⚠ 這步一定要 continue-on-error。以前沒有，它一掛整個 job 就中止，
      #   後面的 daily_check 根本不會執行 → 使用者收到的是「完全沒通知」，
      #   跟「一切正常」長得一模一樣。壞掉的時候更要讓警報跑得到。
      #   腳本本身失敗時不會覆寫既有資料，所以讓它繼續是安全的。
      - name: Fetch ETF base data
        continue-on-error: true
        run: python fetch_etf.py

      - name: Fetch dividend calendar (TWSE official)
        continue-on-error: true
        run: python scripts/fetch_dividend_calendar.py

      # 主動式 ETF 持股（各投信 PCF）。投信官網可能擋 Actions IP 或改版，
      # 失敗不要讓整條 pipeline 掛掉——腳本自己會保留既有檔案不覆蓋。
      - name: Fetch active ETF holdings (PCF)
        continue-on-error: true
        run: python scripts/fetch_active_etf.py

      - name: Daily check & auto-fix avg
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/daily_check.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/_base.json data/dividend_info.json data/dividend_calendar.json data/known_codes.json data/daily_state.json data/etf_pool_cache.json data/active_flow.json data/_active_snapshot.json
          git diff --cached --quiet || git commit -m "chore: update ETF base data $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push

      - name: Trigger update-data to sync market.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-data.yml --repo ${{ github.repository }} --ref main

      # ── Dead man's switch ──────────────────────────────────────────
      # daily_check 只能檢查「跑出來的東西對不對」，抓不到「整條根本沒跑」
      # （Actions 服務中斷、workflow 被停用、repo 設定被改）。那種情況下
      # 使用者收到的是完全靜默，跟一切正常無法區分。
      # 解法是反過來：跑成功就 ping 一次，**沒收到 ping** 就由外部服務通知。
      # HEALTHCHECK_URL 還沒設時整步跳過，不會讓 job 紅燈。
      # 設定方式見 CLAUDE.md「外部死人開關」。
      - name: Ping dead man's switch
        if: success() && env.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL"
