name: Fetch ETF Data

on:
  schedule:
    - cron: "30 0 * * 1-5"   # 台灣時間 08:30，週一至週五
  workflow_dispatch:           # 手動觸發

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Fetch ETF data
        run: python fetch_etf.py

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update ETF data $(date +'%Y-%m-%d %H:%M')"
          git push
