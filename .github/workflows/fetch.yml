name: Fetch ETF Data

on:
  schedule:
    - cron: "0 1 * * 1-5"    # 台灣時間 09:00，週一至週五（錯開 dividend-update 的 08:30）
    - cron: "0 7 * * 1-5"    # 台灣時間 15:00，收盤後 yfinance 更新完畢
  workflow_dispatch:           # 手動觸發

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Fetch ETF base data
        run: python fetch_etf.py

      - name: Fetch dividend calendar (TWSE official)
        run: python scripts/fetch_dividend_calendar.py

      - name: Daily check & auto-fix avg
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/daily_check.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/_base.json data/dividend_info.json data/dividend_calendar.json data/known_codes.json data/daily_state.json
          git diff --cached --quiet || git commit -m "chore: update ETF base data $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push

      - name: Trigger update-data to sync market.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-data.yml --repo ${{ github.repository }} --ref main
