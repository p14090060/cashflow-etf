<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETF健診">
<meta name="theme-color" content="#0d1117">
<title>ETF 存股健診</title>
<style>
  :root {
    --bg:    #0d1117;
    --card:  #161b22;
    --card2: #1c2128;
    --border:#30363d;
    --dim:   #8b949e;
    --bright:#e6edf3;
    --mono:  'Consolas','Courier New',monospace;
    --sans:  'Microsoft JhengHei','微軟正黑體',sans-serif;
    --cheap: #00e5a0;
    --fair:  #F0B840;
    --dear:  #ff3f5e;
    --up:    #ff3f5e;
    --dn:    #00c87a;
    --gold:  #ffd700;
    --nav-h: 62px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  body {
    background:var(--bg); color:var(--bright);
    font-family:var(--sans);
    max-width:430px; margin:0 auto;
    min-height:100vh; position:relative;
    overflow-x:hidden;
  }

  /* ── Top bar ── */
  .topbar {
    position:sticky; top:0; z-index:50;
    background:rgba(13,17,23,.92); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:12px 16px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar-title { font-size:17px; font-weight:700; letter-spacing:.02em; }
  .topbar-sub   { font-family:var(--mono); font-size:10px; color:var(--dim); margin-top:1px; }
  .refresh-btn  { background:none; border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--dim); font-size:18px; cursor:pointer; line-height:1; }
  .refresh-btn.spinning { animation:spin .6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .disclaimer {
    background:rgba(240,184,64,.08); border-bottom:1px solid rgba(240,184,64,.2);
    padding:6px 16px; font-size:11px; color:var(--fair);
    text-align:center; letter-spacing:.02em; line-height:1.5;
  }
  .demo-badge {
    background:rgba(240,184,64,.12); color:var(--fair);
    border:1px solid rgba(240,184,64,.4); border-radius:4px;
    padding:2px 8px; font-size:10px; font-family:var(--mono);
  }

  /* ── Page container ── */
  .pages { padding-bottom:calc(var(--nav-h) + 8px); }
  .page  { display:none; padding:14px 14px 0; }
  .page.active { display:block; }

  /* ── Bottom nav ── */
  .bottom-nav {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:430px;
    height:var(--nav-h);
    background:rgba(22,27,34,.96); backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
    display:flex; z-index:100;
  }
  .nav-btn {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
    cursor:pointer; border:none; background:none;
    color:var(--dim); transition:color .15s; padding:8px 0;
  }
  .nav-btn.active { color:var(--cheap); }
  .nav-btn svg { width:22px; height:22px; }
  .nav-btn span { font-size:11px; font-weight:500; }

  /* ── Cards / layout helpers ── */
  .section-hdr {
    display:flex; align-items:center; gap:8px;
    font-size:18px; font-weight:700; margin-bottom:10px;
    padding-bottom:7px; border-bottom:1px solid var(--border);
  }
  .section-hdr.buy  { color:var(--bright); border-color:rgba(0,229,160,.2); }
  .section-hdr.wait { color:var(--bright); }
  .badge-count {
    font-family:var(--sans); font-size:16px; font-weight:700;
    background:rgba(255,255,255,.07); border-radius:10px; padding:2px 10px;
    color:var(--bright);
  }

  /* ── Market mood ── */
  .mood-card {
    background:var(--card2); border:1px solid var(--border);
    border-radius:12px; padding:13px 14px; margin-bottom:13px;
    display:flex; align-items:center; gap:13px;
  }
  .mood-emoji { font-size:36px; line-height:1; flex-shrink:0; }
  .mood-main  { font-size:17px; font-weight:700; }
  .mood-sub   { font-size:13px; color:var(--bright); margin-top:3px; line-height:1.5; }
  .mood-cta   { font-size:12px; color:#e8607a; margin-top:5px; font-weight:600; }
  .mood-idx   { font-family:var(--mono); font-size:12px; margin-top:4px; }
  .mood-idx.up{ color:var(--up); } .mood-idx.dn{ color:var(--dn); } .mood-idx.flat{ color:var(--dim); }

  /* ── Buy cards ── */
  .buy-card {
    background:rgba(0,229,160,.05); border:1px solid rgba(0,229,160,.2);
    border-radius:11px; padding:13px 14px; margin-bottom:10px;
  }
  .buy-top  { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .buy-code { font-family:var(--sans); font-size:22px; font-weight:700; color:var(--bright); letter-spacing:.04em; }
  .buy-name { font-size:14px; font-weight:500; margin-top:3px; color:#58a6ff; }
  .sig-cheap {
    background:rgba(0,229,160,.12); color:var(--cheap);
    border:1px solid var(--cheap); border-radius:6px;
    padding:3px 10px; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .sig-fair {
    background:rgba(240,184,64,.12); color:var(--fair);
    border:1px solid var(--fair); border-radius:6px;
    padding:3px 10px; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .sig-dear {
    background:rgba(255,63,94,.12); color:var(--dear);
    border:1px solid var(--dear); border-radius:6px;
    padding:3px 10px; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .sig-hot {
    background:rgba(255,149,0,.12); color:#ff9500;
    border:1px solid #ff9500; border-radius:6px;
    padding:3px 10px; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .empty-state {
    background:var(--card2); border:1px solid var(--border);
    border-radius:12px; padding:18px 16px; text-align:center;
    color:var(--dim); font-size:13px; line-height:1.7; margin-bottom:10px;
  }
  .empty-why {
    margin-top:12px; padding:10px 12px;
    background:rgba(88,166,255,.06); border:1px solid rgba(88,166,255,.15);
    border-radius:8px; font-size:12px; color:#58a6ff; text-align:left; line-height:1.7;
  }
  .hot-item {
    display:flex; align-items:center; gap:10px;
    background:var(--card2); border:1px solid var(--border);
    border-radius:10px; padding:10px 13px; margin-bottom:7px;
  }
  .hot-rank { font-family:var(--sans); font-size:15px; font-weight:700; color:var(--dim); width:22px; flex-shrink:0; }
  .hot-rank.gold { color:var(--gold); }
  .hot-rank.silver { color:#aab0b8; }
  .hot-rank.bronze { color:#cd7f32; }
  .buy-stats {
    display:flex; gap:14px; font-size:13px; margin-bottom:9px; flex-wrap:wrap;
  }
  .buy-stats .lbl { color:var(--bright); }
  .buy-stats .val { color:var(--bright); font-family:var(--mono); font-size:15px; font-weight:700; }
  .buy-stats .neg { color:#58a6ff; font-family:var(--mono); font-size:15px; font-weight:700; }
  .buy-stats .pos { color:#58a6ff; font-family:var(--mono); font-size:15px; font-weight:700; }
  .range-track { height:5px; background:rgba(255,255,255,.08); border-radius:3px; position:relative; margin-bottom:4px; }
  .range-fill  { height:100%; border-radius:3px; background:linear-gradient(90deg,rgba(88,166,255,.15),rgba(88,166,255,.6)); }
  .range-dot   { position:absolute; top:50%; transform:translate(-50%,-50%); width:10px; height:10px; border-radius:50%; background:#58a6ff; border:2px solid var(--bg); }
  .range-lbl   { display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--dim); }
  .div-pill {
    display:inline-flex; align-items:center; gap:3px;
    background:rgba(255,149,0,.1); border:1px solid rgba(255,149,0,.35);
    border-radius:20px; padding:5px 12px; font-size:12px; color:#ff9500;
    font-family:var(--mono); margin-top:8px; font-weight:500;
  }
  .div-num { font-size:19px; font-weight:700; }

  /* ── Wait list ── */
  .wait-item {
    display:flex; align-items:center; gap:9px;
    background:rgba(255,255,255,.03); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; margin-bottom:7px;
  }
  .wait-code  { font-family:var(--sans); font-size:18px; font-weight:700; color:var(--bright); width:68px; flex-shrink:0; }
  .wait-name  { font-size:15px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#58a6ff; }
  .wait-sig   { border-radius:6px; padding:4px 12px; font-size:15px; font-weight:700; flex-shrink:0; white-space:nowrap; }
  .wait-sig.dear { background:rgba(255,63,94,.1); color:var(--dear); border:1px solid rgba(255,63,94,.3); }
  .wait-sig.fair { background:rgba(240,184,64,.1); color:var(--fair); border:1px solid rgba(240,184,64,.3); }

  /* ── Dividend page ── */
  .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px; margin-bottom:13px; }
  .panel-title { font-size:17px; font-weight:700; margin-bottom:12px; color:#ff9500; }
  .panel-title .ic { margin-right:6px; }

  /* Calculator */
  .etf-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .etf-chip  {
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    border-radius:20px; padding:6px 13px;
    font-family:var(--sans); font-size:15px; font-weight:700; color:#4a7099; cursor:pointer;
    transition:all .15s;
  }
  .etf-chip:active, .etf-chip.on {
    background:rgba(88,166,255,.15); border-color:#58a6ff; color:#a8ccff; font-size:22px;
  }
  .input-row {
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .input-lbl { font-size:13px; color:var(--bright); }
  .num-input {
    background:var(--card2); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-family:var(--mono); font-size:18px; font-weight:700;
    color:var(--bright); width:90px; text-align:center; outline:none;
    transition:border-color .15s;
  }
  .num-input:focus { border-color:var(--cheap); }
  .custom-row {
    display:flex; gap:8px; margin-bottom:12px; align-items:center;
  }
  .custom-input {
    background:var(--card2); border:1px solid var(--border); border-radius:8px;
    padding:7px 12px; font-family:var(--sans); font-size:16px; font-weight:700;
    color:var(--bright); flex:1; outline:none; transition:border-color .15s;
    letter-spacing:.04em;
  }
  .custom-input::placeholder { color:var(--dim); font-weight:400; font-size:13px; }
  .custom-input:focus { border-color:#ff9500; }
  .custom-btn {
    background:#ff9500; border:none; border-radius:8px;
    padding:7px 16px; font-size:14px; font-weight:700; color:#000;
    cursor:pointer; white-space:nowrap; transition:opacity .15s;
  }
  .custom-btn:active { opacity:.8; }
  .custom-msg { font-size:12px; margin-bottom:10px; padding:6px 10px; border-radius:6px; }
  .custom-msg.ok   { background:rgba(0,229,160,.08); color:var(--cheap); border:1px solid rgba(0,229,160,.2); }
  .custom-msg.warn { background:rgba(240,184,64,.08); color:var(--fair);  border:1px solid rgba(240,184,64,.2); }
  .custom-msg.err  { background:rgba(255,63,94,.08);  color:var(--dear);  border:1px solid rgba(255,63,94,.2); }
  .calc-out {
    background:rgba(0,229,160,.06); border:1px solid rgba(0,229,160,.18);
    border-radius:9px; padding:13px 14px;
  }
  .calc-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .calc-row:last-child { margin:0; padding-top:9px; border-top:1px solid rgba(255,63,94,.15); }
  .calc-lbl  { font-size:12px; color:var(--bright); }
  .calc-lbl .big-num { font-family:var(--sans); font-size:18px; font-weight:700; color:var(--bright); }
  .calc-val  { font-family:var(--mono); font-size:26px; font-weight:700; color:var(--dear); }
  .calc-val.sm { font-size:18px; color:var(--dear); }

  /* Calendar */
  .cal-item {
    display:flex; align-items:center; gap:11px;
    border-radius:9px; padding:10px 12px; margin-bottom:8px;
    background:rgba(255,255,255,.03); border:1px solid var(--border);
  }
  .cal-item.soon { background:rgba(255,215,0,.05); border-color:rgba(255,215,0,.25); }
  .cal-item:last-child { margin:0; }
  .cal-date { text-align:center; width:38px; flex-shrink:0; }
  .cal-day   { font-family:var(--mono); font-size:20px; font-weight:700; display:block; line-height:1; }
  .cal-mon   { font-size:10px; color:var(--bright); }
  .cal-line  { width:1px; height:30px; background:var(--border); flex-shrink:0; }
  .cal-info  { flex:1; }
  .cal-code2 { font-family:var(--sans); font-size:18px; font-weight:700; color:var(--bright); }
  .cal-name2 { font-size:15px; color:#58a6ff; margin-top:2px; }
  .cal-r     { text-align:right; }
  .cal-amt   { font-family:var(--mono); font-size:20px; font-weight:700; color:var(--gold); }
  .cal-ulbl  { font-size:10px; color:var(--bright); }
  .soon-pill {
    display:inline-block; background:rgba(255,215,0,.15); color:var(--gold);
    border-radius:4px; padding:1px 6px; font-size:10px; font-family:var(--mono);
    margin-top:3px;
  }

  /* ── Channel page ── */
  .yt-hero {
    background:linear-gradient(135deg,#1a0a0a,#2a1010);
    border:1px solid rgba(255,63,94,.25); border-radius:14px;
    padding:22px 16px; text-align:center; margin-bottom:13px;
  }
  .yt-logo  { line-height:1; margin-bottom:10px; }
  .yt-logo img { width:288px !important; height:288px !important; max-width:288px !important; object-fit:contain; border-radius:12px; display:block; margin:0 auto; }
  .yt-name  { font-size:19px; font-weight:700; margin-bottom:5px; }
  .yt-desc  { font-size:13px; color:var(--bright); line-height:1.6; margin-bottom:16px; }
  .yt-btn   {
    display:inline-block; background:#ff3f5e; color:#fff;
    border-radius:24px; padding:11px 28px; font-size:14px; font-weight:700;
    text-decoration:none; transition:opacity .15s;
  }
  .yt-btn:active { opacity:.8; }
  .yt-stats {
    display:flex; gap:0; margin-top:16px;
    border-top:1px solid rgba(255,63,94,.2); padding-top:14px;
  }
  .yt-stat { flex:1; text-align:center; }
  .yt-stat .n { font-family:var(--mono); font-size:17px; font-weight:700; color:var(--bright); }
  .yt-stat .l { font-size:11px; color:var(--dim); margin-top:2px; }

  .joke-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:18px 16px; margin-bottom:12px;
  }
  .joke-hdr  { font-size:12px; color:#e8607a; font-weight:600; margin-bottom:10px; letter-spacing:.04em; }
  .joke-body { font-size:15px; color:var(--bright); line-height:1.8; white-space:pre-line; }
  .joke-day  { font-size:11px; color:var(--dim); margin-top:10px; text-align:right; }

  .latest-card {
    background:rgba(255,63,94,.05); border:1px solid rgba(255,63,94,.2);
    border-radius:12px; padding:14px; margin-bottom:12px;
  }
  .latest-lbl { font-size:11px; color:var(--dim); margin-bottom:5px; font-family:var(--mono); }
  .latest-title { font-size:14px; font-weight:700; margin-bottom:10px; line-height:1.4; }
  .latest-link  {
    display:flex; align-items:center; gap:6px;
    color:var(--dear); font-size:13px; font-weight:600; text-decoration:none;
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div>
    <div class="topbar-title">ETF 存股健診</div>
    <div class="topbar-sub" id="updatedAt">載入中…</div>
  </div>
  <button class="refresh-btn" id="refreshBtn" onclick="reloadData()">↻</button>
</div>
<div class="disclaimer">
  ⚠️ 投資一定有風險，基金投資有賺有賠，申購前應詳閱公開說明書。<br>
  本站訊號僅供參考，非個別標的買賣建議。
</div>

<div class="pages">

  <!-- ══ PAGE 1: 今日 ══ -->
  <div class="page active" id="page-today">

    <div class="mood-card">
      <div class="mood-emoji" id="moodEmoji">😊</div>
      <div style="flex:1">
        <div class="mood-main" id="moodText">—</div>
        <div class="mood-sub"  id="moodSub">—</div>
        <div class="mood-cta"  id="moodCta"></div>
        <div class="mood-idx"  id="moodIdx"></div>
      </div>
    </div>

    <div class="section-hdr buy">
      合理價 ETF
      <span class="badge-count" id="buyCount"></span>
    </div>
    <div style="font-size:12px;color:#e8607a;margin:-8px 0 10px 2px">現價在60日均線附近，溢價低、未追熱</div>
    <div id="buyCards"></div>

    <div class="section-hdr wait" style="margin-top:14px">
      今日熱門 ETF TOP 10
    </div>
    <div id="waitItems"></div>

    <div class="section-hdr" style="margin-top:20px; color:#ff9500; border-color:rgba(255,149,0,.2)">
      🔍 查詢其他 ETF
    </div>
    <div class="custom-row">
      <input class="custom-input" id="todayCode" type="text" placeholder="輸入 ETF 代碼，如 00692" maxlength="7">
      <button class="custom-btn" onclick="lookupToday()">查詢</button>
    </div>
    <div class="custom-msg" id="todayMsg" style="display:none"></div>
    <div id="todayResult"></div>

  </div>

  <!-- ══ PAGE 2: 配息 ══ -->
  <div class="page" id="page-div">

    <div class="panel">
      <div class="panel-title">配息計算機</div>
      <div class="etf-chips" id="chips"></div>
      <div class="custom-row">
        <input class="custom-input" id="customCode" type="text" placeholder="輸入其他 ETF 代碼，如 00692" maxlength="7">
        <button class="custom-btn" onclick="lookupCustom()">查詢</button>
      </div>
      <div class="custom-msg" id="customMsg" style="display:none"></div>
      <div class="input-row">
        <span class="input-lbl">我有</span>
        <input class="num-input" id="sharesIn" type="number" min="1" value="10">
        <span class="input-lbl">張</span>
      </div>
      <div class="calc-out" id="calcOut"></div>
    </div>

    <div class="panel">
      <div class="panel-title">近期配息日曆</div>
      <div id="calList"></div>
    </div>

  </div>

  <!-- ══ PAGE 3: 頻道 ══ -->
  <div class="page" id="page-yt">

    <div class="yt-hero">
      <div class="yt-logo"><img src="logo.png"></div>
      <div class="yt-name">金流黑盒子</div>
      <div class="yt-desc">
        看懂資金流向，才知道主力在做什麼。<br>
        ETF 存股 × 大盤分析 × 個股佈局
      </div>
      <a class="yt-btn" href="https://www.youtube.com/@CashFlowDataRecorder" target="_blank">訂閱頻道 ▶</a>
      <div class="yt-stats">
        <div class="yt-stat"><div class="n">每週</div><div class="l">固定更新</div></div>
        <div class="yt-stat"><div class="n">ETF</div><div class="l">深度分析</div></div>
        <div class="yt-stat"><div class="n">免費</div><div class="l">完全公開</div></div>
      </div>
    </div>

    <div class="latest-card">
      <div class="latest-lbl">▶ 最新影片</div>
      <div class="latest-title">0056 為什麼現在變便宜了？主力資金悄悄流入</div>
      <a class="latest-link" href="https://www.youtube.com/@CashFlowDataRecorder" target="_blank">
        <span>▶</span> 立即觀看
      </a>
    </div>

    <div class="joke-card">
      <div class="joke-hdr">😄 今日股市笑話</div>
      <div class="joke-body" id="jokeBody"></div>
      <div class="joke-day" id="jokeDay"></div>
    </div>

  </div>

</div><!-- /pages -->

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-today" onclick="switchPage('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>

// ── Page switch ──
function switchPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.getElementById('nav-'+id).classList.add('active');
  window.scrollTo(0,0);
}

// ── Mutable globals（renderAll 會更新）──
let ETFS = STATIC_ETFS;
let selETF = ETFS[0];

// ── Chip & calculator ──
function renderChips() {
  document.getElementById('chips').innerHTML = ETFS.map(e =>
    `<div class="etf-chip ${e.code===selETF.code?'on':''}" onclick="selChip('${e.code}')">${e.code}</div>`
  ).join('');
}
function selChip(code) { selETF = ETFS.find(e => e.code===code); renderChips(); calcUpdate(); }
function calcUpdate() {
  const n = parseInt(document.getElementById('sharesIn').value) || 0;
  const next = (selETF.est * n).toFixed(0);
  const ann  = (selETF.yld / 100 * selETF.price * n * 1000).toFixed(0);
  const cost = (selETF.price * n * 1000).toFixed(0);
  document.getElementById('calcOut').innerHTML = `
    <div class="calc-row"><span class="calc-lbl"><span class="big-num">${selETF.days}</span> 天後可以領</span><span class="calc-val">${parseInt(next).toLocaleString()} 元</span></div>
    <div class="calc-row"><span class="calc-lbl">預估年化領回</span><span class="calc-val sm">${parseInt(ann).toLocaleString()} 元 (${selETF.yld}%)</span></div>
    <div class="calc-row"><span class="calc-lbl">${n} 張市值約</span><span class="calc-val sm">${parseInt(cost).toLocaleString()} 元</span></div>`;
}
document.getElementById('sharesIn').addEventListener('input', calcUpdate);

// ── Signal card renderer ──
function renderSignalCard(etf, estimated) {
  const pos = Math.min(97, Math.max(3, (etf.price - etf.low52) / (etf.high52 - etf.low52) * 100));
  const sigLabel = { cheap:'現在便宜 ✓', fair:'合理價 ✓', hot:'過熱 ⚡', dear:'目前偏貴' }[etf.signal] || '目前偏貴';
  const sigClass = { cheap:'sig-cheap', fair:'sig-fair', hot:'sig-hot', dear:'sig-dear' }[etf.signal] || 'sig-dear';
  const note = estimated ? `<div style="font-size:11px;color:var(--dim);margin-top:8px">⚠ 估算數值，每日更新後將顯示真實資料</div>` : '';
  return `<div class="buy-card">
    <div class="buy-top">
      <div><div class="buy-code">${etf.code}</div><div class="buy-name">${etf.name}</div></div>
      <div class="${sigClass}">${sigLabel}</div>
    </div>
    <div class="buy-stats">
      <span><span class="lbl">現價 </span><span class="val">${etf.price}</span></span>
      <span><span class="lbl">殖利率 </span><span class="val">${etf.yld}%</span></span>
      <span><span class="lbl">60MA </span><span class="${etf.maD>=0?'pos':'neg'}">${etf.maD>=0?'+':''}${etf.maD.toFixed(1)}%</span></span>
    </div>
    <div class="range-track">
      <div class="range-fill" style="width:${pos}%"></div>
      <div class="range-dot"  style="left:${pos}%"></div>
    </div>
    <div class="range-lbl"><span>低 ${etf.low52}</span><span>高 ${etf.high52}</span></div>
    <div class="div-pill">🎁 <span class="div-num">${etf.days}</span> 天後配息 · 預估 <span class="div-num">${etf.est.toFixed(2)}</span> 元/張</div>
    ${note}
  </div>`;
}

// ── Lookup functions ──
function lookupCustom() {
  const raw = document.getElementById('customCode').value.trim().toUpperCase();
  const msgEl = document.getElementById('customMsg');
  if (!raw) { msgEl.style.display='none'; return; }
  const found = ETFS.find(e => e.code === raw);
  if (found) {
    msgEl.className = 'custom-msg ok';
    msgEl.textContent = `✓ ${found.code} ${found.name} 已在清單中，請直接點選上方晶片`;
    msgEl.style.display = 'block';
    selChip(found.code);
    return;
  }
  if (!/^\d{4,6}[A-Z]?$/.test(raw)) {
    msgEl.className = 'custom-msg err';
    msgEl.textContent = `✗ 「${raw}」不像是有效的 ETF 代碼`;
    msgEl.style.display = 'block';
    return;
  }
  msgEl.className = 'custom-msg warn';
  msgEl.textContent = `⚠ ${raw} 不在預設清單，以下為估算數值`;
  msgEl.style.display = 'block';
  const estPrice = 20 + Math.floor((parseInt(raw) % 100) * 0.6);
  const estYld   = 4.5 + (parseInt(raw.replace(/\D/g,'')) % 30) * 0.1;
  const estDays  = 30 + (parseInt(raw.replace(/\D/g,'')) % 60);
  selETF = {
    code: raw, name: `ETF ${raw}（估算）`,
    price: estPrice, ma60: estPrice * 0.98,
    low52: estPrice * 0.85, high52: estPrice * 1.12,
    yld: parseFloat(estYld.toFixed(1)),
    days: estDays, est: parseFloat(((estPrice * estYld / 100) / 4).toFixed(2)),
    signal: 'fair', maD: 0
  };
  const chips = document.getElementById('chips');
  const existing = chips.querySelector('.custom-chip');
  if (existing) existing.remove();
  const chip = document.createElement('div');
  chip.className = 'etf-chip on custom-chip';
  chip.textContent = raw;
  chips.appendChild(chip);
  chips.querySelectorAll('.etf-chip:not(.custom-chip)').forEach(c => c.classList.remove('on'));
  calcUpdate();
}

function lookupToday() {
  const raw = document.getElementById('todayCode').value.trim().toUpperCase();
  const msgEl = document.getElementById('todayMsg');
  const resEl = document.getElementById('todayResult');
  resEl.innerHTML = '';
  if (!raw) { msgEl.style.display = 'none'; return; }
  const found = ETFS.find(e => e.code === raw);
  if (found) {
    msgEl.style.display = 'none';
    resEl.innerHTML = renderSignalCard(found, false);
    return;
  }
  if (!/^\d{4,6}[A-Z]?$/.test(raw)) {
    msgEl.className = 'custom-msg err';
    msgEl.textContent = `✗ 「${raw}」不像是有效的 ETF 代碼`;
    msgEl.style.display = 'block';
    return;
  }
  msgEl.className = 'custom-msg warn';
  msgEl.textContent = `⚠ ${raw} 不在預設清單，以下為估算數值`;
  msgEl.style.display = 'block';
  const base = parseInt(raw.replace(/\D/g, ''));
  const estPrice = parseFloat((20 + (base % 100) * 0.6).toFixed(1));
  const estYld   = parseFloat((4.5 + (base % 30) * 0.1).toFixed(1));
  const estDays  = 30 + (base % 60);
  const estMaD   = parseFloat((((base % 20) - 10) * 0.3).toFixed(1));
  resEl.innerHTML = renderSignalCard({
    code: raw, name: `ETF ${raw}`,
    price: estPrice, ma60: estPrice * 0.98,
    low52: parseFloat((estPrice * 0.85).toFixed(1)),
    high52: parseFloat((estPrice * 1.15).toFixed(1)),
    yld: estYld, days: estDays,
    est: parseFloat(((estPrice * estYld / 100) / 4).toFixed(2)),
    signal: estMaD < -2 ? 'cheap' : estMaD > 2 ? 'dear' : 'fair', maD: estMaD
  }, true);
}

document.getElementById('customCode').addEventListener('keydown', e => { if (e.key==='Enter') lookupCustom(); });
document.getElementById('todayCode').addEventListener('keydown',  e => { if (e.key==='Enter') lookupToday();  });

// ── Mood card ──
function renderMood(market) {
  const pct = market ? market.change_pct : 0;
  const pt  = market ? market.change_pt  : 0;
  const pr  = market ? market.price      : 0;

  const MOODS = [
    { min:  1.0, emoji:'🚀', main:'大盤狂奔中',     sub:'追的人開心、沒上車的焦慮',     cta:'⚠️ 越漲越要冷靜，看看你想買的還合理嗎 ▼' },
    { min:  0.3, emoji:'😊', main:'大盤微微暖',     sub:'存股族笑笑看，跟風族先別急',   cta:'🔥 熱門排行更新囉 ▼' },
    { min: -0.3, emoji:'😐', main:'大盤裝睡中',     sub:'不漲不跌，適合慢慢挑',         cta:'🎯 來看看哪些 ETF 處於甜蜜點 ▼' },
    { min: -1.0, emoji:'🍂', main:'大盤小休息',     sub:'存股族的撿便宜時機到了？',     cta:'💧 今日合理價清單 ▼' },
    { min: -999, emoji:'🌧️', main:'大盤下雨天',     sub:'新聞會嚇人，但便宜貨可能來了', cta:'💎 跌出機會了嗎？來看健診 ▼' },
  ];

  const m = MOODS.find(x => pct >= x.min) || MOODS[MOODS.length-1];
  document.getElementById('moodEmoji').textContent = m.emoji;
  document.getElementById('moodText').textContent  = m.main;
  document.getElementById('moodSub').textContent   = m.sub;
  document.getElementById('moodCta').textContent   = m.cta;

  const sign  = pt >= 0 ? '▲' : '▼';
  const cls   = pct >= 0.3 ? 'up' : pct <= -0.3 ? 'dn' : 'flat';
  const arrow = pt >= 0 ? '+' : '';
  const idxEl = document.getElementById('moodIdx');
  idxEl.className = `mood-idx ${cls}`;
  idxEl.textContent = pr > 0
    ? `加權 ${sign} ${arrow}${pt.toFixed(1)} (${arrow}${pct.toFixed(2)}%)`
    : '';
}

// ── renderAll：用資料渲染整頁 ──
function renderAll(etfs, cal, updatedAt, market) {
  ETFS = etfs;
  document.getElementById('updatedAt').textContent = updatedAt + ' 盤後更新';
  renderMood(market);

  const SIG_LABEL = { cheap:'現在便宜 ✓', fair:'合理價 ✓', hot:'過熱 ⚡', dear:'目前偏貴' };
  const SIG_CLASS = { cheap:'sig-cheap', fair:'sig-fair', hot:'sig-hot', dear:'sig-dear' };

  const fairList = ETFS.filter(e => e.signal==='cheap' || e.signal==='fair');
  document.getElementById('buyCount').textContent = fairList.length + ' 支';

  if (fairList.length === 0) {
    document.getElementById('buyCards').innerHTML = `
      <div class="empty-state">
        目前沒有 ETF 符合篩選條件<br>
        大盤偏熱，可參考下方熱門排行或自行搜尋
        <div class="empty-why">
          ℹ️ 為什麼今天沒有？<br>
          當 ETF 普遍溢價、追在均線上方時，就會出現 0 支符合條件的情況。<br>
          這代表今天不是好的進場時機。
        </div>
      </div>`;
  } else {
    document.getElementById('buyCards').innerHTML = fairList.map(e => {
      const pos = Math.min(97, Math.max(3, (e.price-e.low52)/(e.high52-e.low52)*100));
      return `<div class="buy-card">
        <div class="buy-top">
          <div><div class="buy-code">${e.code}</div><div class="buy-name">${e.name}</div></div>
          <div class="${SIG_CLASS[e.signal]}">${SIG_LABEL[e.signal]}</div>
        </div>
        <div class="buy-stats">
          <span><span class="lbl">現價 </span><span class="val">${e.price}</span></span>
          <span><span class="lbl">殖利率 </span><span class="val">${e.yld}%</span></span>
          <span><span class="lbl">60MA </span><span class="${e.maD>=0?'pos':'neg'}">${e.maD>=0?'+':''}${e.maD.toFixed(1)}%</span></span>
        </div>
        <div class="range-track">
          <div class="range-fill" style="width:${pos}%"></div>
          <div class="range-dot"  style="left:${pos}%"></div>
        </div>
        <div class="range-lbl"><span>低 ${e.low52}</span><span>高 ${e.high52}</span></div>
        <div class="div-pill">🎁 <span class="div-num">${e.days}</span> 天後配息 · 預估 <span class="div-num">${e.est.toFixed(2)}</span> 元/張</div>
      </div>`;
    }).join('');
  }

  // TOP 10 熱門：依 heat 分數排序
  const top10 = [...ETFS].sort((a,b) => (b.heat||0)-(a.heat||0)).slice(0,10);
  const rankClass = i => i===0?'gold':i===1?'silver':i===2?'bronze':'';
  document.getElementById('waitItems').innerHTML = top10.map((e,i) => `
    <div class="hot-item">
      <div class="hot-rank ${rankClass(i)}">${i+1}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="wait-code" style="font-size:16px">${e.code}</span>
          <span class="wait-name">${e.name}</span>
        </div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px">
          現價 ${e.price} · 殖利率 ${e.yld}%
        </div>
      </div>
      <div class="${SIG_CLASS[e.signal]}">${SIG_LABEL[e.signal]}</div>
    </div>`).join('');

  selETF = ETFS.find(e => e.code==='0056') || ETFS[0];
  renderChips();
  calcUpdate();

  document.getElementById('calList').innerHTML = cal.map(c => `
    <div class="cal-item ${c.soon?'soon':''}">
      <div class="cal-date"><span class="cal-day">${c.day}</span><span class="cal-mon">${c.mon}</span></div>
      <div class="cal-line"></div>
      <div class="cal-info"><div class="cal-code2">${c.code}</div><div class="cal-name2">${c.name}</div></div>
      <div class="cal-r">
        <div class="cal-amt">${c.amt.toFixed(2)} 元</div>
        <div class="cal-ulbl">每張</div>
        ${c.soon?'<div class="soon-pill">快到了！</div>':''}
      </div>
    </div>`).join('');
}

(function renderJoke() {
  const now   = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const day   = Math.floor((now - start) / 86400000);
  const joke  = JOKES[day % JOKES.length];
  const nth   = day % JOKES.length + 1;
  document.getElementById('jokeBody').textContent = joke;
  document.getElementById('jokeDay').textContent  = `第 ${nth} / ${JOKES.length} 則`;
})();
</script>
